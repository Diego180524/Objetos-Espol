<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Objetos ESPOL</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('fondo-espol.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 33, 66, 0.45); /* Azul más suavecito y transparente */
            backdrop-filter: blur(2px); /* Desenfoque bajito para que se distinga la foto */
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 400px; text-align: center;">
        <h1>Objetos ESPOL</h1>
        <p>Ingresa con tu cuenta institucional</p>

        <form>
            <label style="display: block; text-align: left;">Correo ESPOL:</label>
            <input type="email" placeholder="usuario@espol.edu.ec" style="width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box;"><br>

            <label style="display: block; text-align: left;">Contraseña:</label>
            <input type="password" placeholder="********" style="width: 100%; padding: 8px; margin-bottom: 20px; box-sizing: border-box;"><br>

            <button type="button" onclick="window.location.href='menu.html'" style="background-color: #003366; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%;">Ingresar</button>
        </form>
        
        <p style="font-size: 12px; color: gray; margin-top: 20px;">*Acceso exclusivo para la comunidad politécnica.</p>
    </div>
</body>
</html>
