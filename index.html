<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Objetos ESPOL</title>
    <!-- Conectado al CSS centralizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-index">
    <div class="container" style="max-width: 400px; text-align: center;">
        
        <!-- Logo de la tortuguita ESPOL -->
        <img src="logo-tortuga.png" alt="Logo ESPOL" style="width: 80px; height: 80px; margin-bottom: 10px; object-fit: contain;">

        <h1 style="margin-top: 0;">Objetos ESPOL</h1>
        <p>Ingresa con tu cuenta institucional</p>

        <form>
            <label style="display: block; text-align: left;">Correo ESPOL:</label>
            <input type="email" placeholder="usuario@espol.edu.ec" style="width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box;"><br>

            <label style="display: block; text-align: left;">Contraseña:</label>
            <input type="password" placeholder="********" style="width: 100%; padding: 8px; margin-bottom: 20px; box-sizing: border-box;"><br>

            <button type="button" onclick="window.location.href='menu.html'" style="background-color: #003366; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; margin: 0;">Ingresar</button>
        </form>
        
        <p style="font-size: 12px; color: gray; margin-top: 20px; margin-bottom: 0;">*Acceso exclusivo para la comunidad politécnica.</p>
    </div>
</body>
</html>
