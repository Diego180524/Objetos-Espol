<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Objetos ESPOL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 400px; margin: 50px auto; text-align: center;">
        <h1>Objetos ESPOL</h1>
        <p>Ingresa con tu cuenta institucional</p>

        <form>
            <label style="display: block; text-align: left;">Correo ESPOL:</label>
            <input type="email" placeholder="usuario@espol.edu.ec" style="width: 100%; padding: 8px; margin-bottom: 15px;"><br>

            <label style="display: block; text-align: left;">Contraseña:</label>
            <input type="password" placeholder="********" style="width: 100%; padding: 8px; margin-bottom: 20px;"><br>

            <!-- Aquí está la magia: ahora te lleva a menu.html -->
            <button type="button" onclick="window.location.href='menu.html'" style="background-color: #003366; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%;">Ingresar</button>
        </form>
        
        <p style="font-size: 12px; color: gray; margin-top: 20px;">*Acceso exclusivo para la comunidad politécnica.</p>
    </div>
</body>
</html>
