<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Objetos ESPOL</title>
    <!-- Conectado al CSS centralizado -->
    <link rel="stylesheet" href="style.css"> 
    <script>
        function abrirChat() {
            document.getElementById('chat-box').style.display = 'flex';
        }
        function cerrarChat() {
            document.getElementById('chat-box').style.display = 'none';
        }
    </script>
</head>
<body class="body-menu">
    <div class="container">
        <h1>Objetos ESPOL</h1>
        <p>Sistema de objetos perdidos y encontrados</p>

        <!-- Alerta de Match Automático -->
        <div style="background-color: #fff3cd; color: #856404; padding: 15px; border-radius: 5px; border: 1px solid #ffeeba; margin-bottom: 20px; text-align: left;">
            <strong>¡Buenas noticias! 🚨</strong> Alguien reportó haber encontrado una "Cartuchera negra" en FCSH hace 10 minutos. ¿Es la tuya?
            <br><br>
            <button onclick="abrirChat()" style="background-color: #28a745; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px;">Sí, abrir chat</button>
            <button onclick="this.parentElement.style.display='none'" style="background-color: #6c757d; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px;">No es mía</button>
        </div>

        <div style="display: flex; gap: 10px; justify-content: center;">
            <button onclick="window.location.href='estudiante.html'" style="flex: 1;">Estudiante</button>
            <button onclick="window.location.href='guardia.html'" style="flex: 1;">Personal autorizado</button>
        </div>
    </div>

    <!-- Cuadro Rectangular del Chat (Oculto al inicio) -->
    <div id="chat-box">
        <div class="chat-header">
            <span><strong>Chat - Cartuchera negra (FCSH)</strong></span>
            <button onclick="cerrarChat()" style="background: none; border: none; color: white; font-size: 16px; cursor: pointer;">✕</button>
        </div>
        <div class="chat-body">
            <p style="background: #f1f0f0; padding: 8px; border-radius: 5px; width: fit-content; margin: 0;">Hola, encontré esta cartuchera cerca de las bancas de FCSH. ¿Pasas retirándola por la garita?</p>
        </div>
        <div class="chat-footer">
            <input type="text" placeholder="Escribe un mensaje..." style="flex: 1; padding: 5px; border: 1px solid #ccc; border-radius: 3px;">
            <button style="background-color: #003366; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin: 0;">Enviar</button>
        </div>
    </div>
</body>
</html>
