<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Seguridad - Objetos ESPOL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .panel-seguridad-container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: left;
            background: #ffffff;
            padding: 24px 28px;
            border-radius: 18px;
            box-shadow: 0 6px 24px rgba(0, 33, 66, 0.08);
            border: 1px solid #e2e8f0;
        }

        .header-panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 14px;
        }

        .header-panel-row h1 {
            margin: 0 0 4px 0;
            font-size: 22px;
            color: #003366;
            font-weight: 800;
        }

        .header-panel-row p {
            margin: 0;
            font-size: 13px;
            color: #64748b;
        }

        .btn-volver-menu {
            background: #f8fafc;
            border: 1.5px solid #cbd5e1;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
            color: #003366;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-volver-menu:hover {
            background: #f1f5f9;
            border-color: #003366;
            transform: translateY(-1px);
        }

        .filtros-box {
            background-color: #f8fafc;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .filtros-box strong {
            font-size: 13px;
            color: #0b2545;
        }

        .filtros-box select {
            padding: 7px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 12.5px;
            color: #1e293b;
            background: #ffffff;
            outline: none;
            flex: 1;
            min-width: 150px;
        }

        .filtros-box select:focus {
            border-color: #003366;
        }

        .tabla-scroll {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        thead tr {
            background-color: #003366;
            color: white;
        }

        th {
            padding: 11px 14px;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        td {
            padding: 11px 14px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
            vertical-align: middle;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        .badge-estado {
            font-weight: 800;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            display: inline-block;
        }

        .badge-estado.perdido {
            background: #fee2e2;
            color: #b91c1c;
        }

        .badge-estado.encontrado {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-estado.entregado {
            background: #e2e8f0;
            color: #475569;
        }

        .btn-accion-entregar {
            padding: 5px 12px;
            font-size: 11.5px;
            font-weight: 700;
            background-color: #15803d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0;
        }

        .btn-accion-entregar:hover {
            background-color: #166534;
        }

        .btn-accion-entregar.resuelto {
            background-color: #cbd5e1;
            color: #64748b;
            cursor: not-allowed;
        }

        #mapaGuardia {
            height: 380px;
            width: 100%;
            border-radius: 12px;
            margin-bottom: 14px;
            border: 1.5px solid #cbd5e1;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.06);
            overflow: hidden;
        }
    </style>
</head>
<body class="body-guardia">
    <div class="panel-seguridad-container">
        
        <div class="header-panel-row">
            <div>
                <h1>Panel de Seguridad ESPOL</h1>
                <p>Gestión de objetos perdidos y encontrados.</p>
            </div>
            <a href="menu.html" class="btn-volver-menu">← Volver al Menú</a>
        </div>

        <div class="filtros-box">
            <strong>Filtros:</strong>
            <select id="filtroUbicacion" onchange="filtrarReportes()">
                <option value="Todos">Todas las ubicaciones</option>
                <option value="FADCOM">FADCOM</option>
                <option value="FCNM">FCNM</option>
                <option value="FCSH">FCSH</option>
                <option value="FCV">FCV</option>
                <option value="FICT">FICT</option>
                <option value="FIEC">FIEC</option>
                <option value="FIMCM">FIMCM</option>
                <option value="FIMCP">FIMCP</option>
                <option value="Biblioteca">Biblioteca</option>
                <option value="Sweet and Coffee">Sweet & Coffee</option>
                <option value="Otros">Otros</option>
            </select>
            <select id="filtroEstado" onchange="filtrarReportes()">
                <option value="Todos">Todos los estados</option>
                <option value="Perdido">Perdidos</option>
                <option value="Encontrado">Encontrados</option>
                <option value="Entregado">Entregados</option>
            </select>
            <button onclick="filtrarReportes()" style="padding: 7px 16px; margin: 0; font-size: 12.5px; border-radius: 8px;">Buscar</button>
        </div>

        <div class="tabla-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Objeto</th>
                        <th>Lugar</th>
                        <th>Contacto</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaReportes"></tbody>
            </table>
        </div>

        <h3 style="color: #003366; margin: 0 0 6px 0; font-size: 16px;">Mapa General de Reportes</h3>
        <p style="font-size: 12.5px; color: #64748b; margin-bottom: 12px;">Visualización geográfica desde Prosperina hasta Ceibos y Prepo:</p>
        <div id="mapaGuardia"></div>

        <a href="menu.html" style="color: #003366; font-weight: bold; text-decoration: none; font-size: 13px;">← Volver al inicio</a>
    </div>

    <script>
        let mapa;
        let markersGroup;

        const coordenadasZonas = {
            "FCSH": [-2.1478, -79.9678],
            "FIEC": [-2.1448, -79.9675],
            "FADCOM": [-2.1485, -79.9632],
            "FCNM": [-2.1460, -79.9660],
            "FICT": [-2.1435, -79.9685],
            "FCV": [-2.1500, -79.9640],
            "FIMCM": [-2.1425, -79.9650],
            "FIMCP": [-2.1415, -79.9665],
            "Biblioteca": [-2.1462, -79.9655],
            "Sweet and Coffee": [-2.1455, -79.9670],
            "Sweet & Coffee": [-2.1455, -79.9670],
            "Otros": [-2.1520, -79.9620]
        };

        const baseFicticia = [
            { id: "base-1", titulo: "Cartuchera negra", lugar: "FCSH", contacto: "0987654321", estado: "Perdido" },
            { id: "base-2", titulo: "Carné estudiantil", lugar: "Biblioteca", contacto: "usuario@espol.edu.ec", estado: "Encontrado" }
        ];

        window.onload = function() {
            const esquinaSurOeste = L.latLng(-2.1800, -79.9800);
            const esquinaNorEste = L.latLng(-2.1330, -79.9450);
            const limitesAmpliados = L.latLngBounds(esquinaSurOeste, esquinaNorEste);

            mapa = L.map('mapaGuardia', {
                center: [-2.1500, -79.9640],
                zoom: 15,
                minZoom: 14,
                maxZoom: 19,
                maxBounds: limitesAmpliados,
                maxBoundsViscosity: 0.9
            });

            L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '&copy; Google Maps'
            }).addTo(mapa);

            markersGroup = L.layerGroup().addTo(mapa);

            renderizarDatos();

            setTimeout(() => {
                mapa.invalidateSize();
            }, 300);
        };

        function obtenerReportes() {
            const guardados = JSON.parse(localStorage.getItem("reportes_polifind") || "[]");
            return [...guardados, ...baseFicticia];
        }

        function renderizarDatos() {
            const filtroUbi = document.getElementById("filtroUbicacion").value;
            const filtroEst = document.getElementById("filtroEstado").value;
            const tbody = document.getElementById("tablaReportes");

            tbody.innerHTML = "";
            markersGroup.clearLayers();

            const items = obtenerReportes();

            items.forEach((item, index) => {
                const ubiNormalizada = item.lugar === "Sweet & Coffee" ? "Sweet and Coffee" : item.lugar;
                const coincideUbi = filtroUbi === "Todos" || item.lugar === filtroUbi || ubiNormalizada === filtroUbi;
                const coincideEst = filtroEst === "Todos" || item.estado.toLowerCase() === filtroEst.toLowerCase();

                if (!coincideUbi || !coincideEst) return;

                const tr = document.createElement("tr");

                let badgeTipo = "entregado";
                if (item.estado.toLowerCase().includes("perd")) badgeTipo = "perdido";
                else if (item.estado.toLowerCase().includes("encontr")) badgeTipo = "encontrado";

                const esEntregado = item.estado.toLowerCase() === "entregado";

                tr.innerHTML = `
                    <td><strong>${item.titulo}</strong></td>
                    <td>${item.lugar}</td>
                    <td>${item.contacto || 'Sin contacto'}</td>
                    <td><span class="badge-estado ${badgeTipo}">${item.estado}</span></td>
                    <td>
                        <button class="btn-accion-entregar ${esEntregado ? 'resuelto' : ''}" 
                                onclick="marcarComoEntregado('${item.id || index}', ${item.id ? 'false' : 'true'})" 
                                ${esEntregado ? 'disabled' : ''}>
                            ${esEntregado ? '✓ Entregado' : 'Entregar'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);

                const coords = coordenadasZonas[item.lugar] || coordenadasZonas["Otros"];
                const marker = L.marker(coords).addTo(markersGroup);
                marker.bindPopup(`
                    <div style="font-size: 13px; line-height: 1.4;">
                        <strong style="color: #003366;">${item.titulo}</strong><br>
                        <span>📍 Ubicación: ${item.lugar}</span><br>
                        <span>Estado: <strong>${item.estado}</strong></span><br>
                        ${item.contacto ? `<span>✉ Contacto: ${item.contacto}</span>` : ''}
                    </div>
                `);
            });
        }

        function marcarComoEntregado(idOIndex, esPorIndice) {
            if (!confirm("¿Confirmas que este objeto ha sido entregado o devuelto?")) return;

            const guardados = JSON.parse(localStorage.getItem("reportes_polifind") || "[]");

            if (esPorIndice) {
                const idx = parseInt(idOIndex, 10);
                if (guardados[idx]) {
                    guardados[idx].estado = "Entregado";
                    localStorage.setItem("reportes_polifind", JSON.stringify(guardados));
                }
            } else {
                const encontrado = guardados.find(r => r.id === idOIndex);
                if (encontrado) {
                    encontrado.estado = "Entregado";
                    localStorage.setItem("reportes_polifind", JSON.stringify(guardados));
                } else {
                    const itemBase = baseFicticia.find(r => r.id === idOIndex);
                    if (itemBase) itemBase.estado = "Entregado";
                }
            }

            renderizarDatos();
        }

        function filtrarReportes() {
            renderizarDatos();
        }
    </script>
</body>
</html>
