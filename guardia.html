<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Guardias - Objetos ESPOL</title>
    <!-- Conectado al CSS centralizado -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="body-guardia">
    <div class="container" style="max-width: 1000px; margin: 0 auto; text-align: left;">
        <h1 style="text-align: center;">Panel de Seguridad ESPOL</h1>
        <p style="text-align: center;">Gestión de objetos perdidos y encontrados.</p>

        <!-- Filtros -->
        <div style="background-color: #f1f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
            <strong>Filtros:</strong>
            <select style="padding: 5px; flex: 1; min-width: 150px;">
                <option>Todas las ubicaciones</option>
                <option>FCSH</option>
                <option>FIEC</option>
                <option>Biblioteca</option>
                <option>Sweet & Coffee</option>
            </select>
            <select style="padding: 5px; flex: 1; min-width: 150px;">
                <option>Todos los estados</option>
                <option>Perdidos</option>
                <option>Encontrados</option>
            </select>
            <button style="padding: 6px 15px; margin: 0;">Buscar</button>
        </div>

        <div style="overflow-x: auto;">
            <table border="1" style="width: 100%; text-align: left; margin-bottom: 20px; border-collapse: collapse; border-color: #ddd;">
                <tr style="background-color: #003366; color: white;">
                    <th style="padding: 10px;">Objeto</th>
                    <th style="padding: 10px;">Lugar</th>
                    <th style="padding: 10px;">Contacto</th>
                    <th style="padding: 10px;">Estado</th>
                    <th style="padding: 10px;">Acción</th>
                </tr>
                <tr>
                    <td style="padding: 10px;">Cartuchera negra</td>
                    <td style="padding: 10px;">FCSH</td>
                    <td style="padding: 10px;">0987654321</td>
                    <td style="padding: 10px; color: red; font-weight: bold;">Perdido</td>
                    <td style="padding: 10px;"><button style="padding: 5px 10px; font-size: 12px; background-color: #28a745; margin: 0;">Entregar</button></td>
                </tr>
                <tr>
                    <td style="padding: 10px;">Carné estudiantil</td>
                    <td style="padding: 10px;">Biblioteca</td>
                    <td style="padding: 10px;">usuario@espol.edu.ec</td>
                    <td style="padding: 10px; color: green; font-weight: bold;">Encontrado</td>
                    <td style="padding: 10px;"><button style="padding: 5px 10px; font-size: 12px; background-color: #28a745; margin: 0;">Entregar</button></td>
                </tr>
            </table>
        </div>

        <h3>Mapa General de Reportes</h3>
        <div id="mapaGuardia" style="height: 300px; width: 100%; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ddd;"></div>

        <a href="index.html" style="color: #003366; font-weight: bold; text-decoration: none;">← Volver al inicio</a>
    </div>

    <script>
        const mapa = L.map('mapaGuardia').setView([-2.147, -79.966], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);

        L.marker([-2.148, -79.967]).addTo(mapa).bindPopup("Cartuchera negra (FCSH) - Perdido");
        L.marker([-2.146, -79.964]).addTo(mapa).bindPopup("Carné (Biblioteca) - Encontrado");
    </script>
</body>
</html>
