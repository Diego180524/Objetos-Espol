<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Estudiante</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="container">
        <h1>Reportar Objeto</h1>
        <p>Ayúdanos a devolver las cosas a su dueño en la ESPOL.</p>

        <form>
            <!-- Lo nuevo: Tipo de reporte -->
            <label>¿Qué deseas hacer?</label><br>
            <select>
                <option>Perdí algo 😭</option>
                <option>Encontré algo 😇</option>
            </select><br><br>

            <label>¿Qué objeto es?</label><br>
            <select>
                <option>Cartuchera</option>
                <option>Tomatodo</option>
                <option>Abrigo</option>
                <option>Cédula / Carné</option>
                <option>Audífonos</option>
                <option>Otros</option>
            </select><br><br>

            <label>Descripción detallada:</label><br>
            <textarea rows="3" placeholder="Ej: Es negra con cierre rojo..."></textarea><br><br>

            <!-- Lo nuevo: Contacto -->
            <label>Tu correo ESPOL o WhatsApp (para avisarte):</label><br>
            <input type="text" placeholder="Ej: usuario@espol.edu.ec / 098..."><br><br>

            <label>¿Dónde fue?</label><br>
            <select>
                <option>FCSH</option>
                <option>FIEC</option>
                <option>FCSNM</option>
                <option>FIMCP</option>
                <option>FICT</option>
                <option>FIMAR</option>
                <option>FADCOM</option>
                <option>FCV</option>
                <option>CELEX</option>
                <option>Biblioteca</option>
                <option>Estación de buses</option>
                <option>Sweet & Coffee (FCSH)</option>
                <option>PARCON</option>
                <option>Otro lugar</option>
            </select><br><br>

            <button type="button" onclick="obtenerUbicacion()" style="background-color: #28a745;">📍 Usar mi ubicación actual</button>
            <p id="coordenadas" style="color: #003366; font-size: 14px; font-weight: bold;"></p>
            
            <div id="miMapa" style="height: 250px; width: 100%; border-radius: 10px; display: none; margin-bottom: 20px; z-index: 1;"></div>

            <label>Sube una foto (si tienes):</label><br>
            <input type="file" accept="image/*"><br><br>

            <button type="button">Publicar Reporte</button>
        </form>
        
        <br>
        <a href="index.html">Volver al inicio</a>
    </div>

    <script>
        let mapa;
        let marcador;

        function obtenerUbicacion() {
            const texto = document.getElementById("coordenadas");
            const divMapa = document.getElementById("miMapa");

            if (navigator.geolocation) {
                texto.innerHTML = "Buscando tu ubicación... ⏳";
                navigator.geolocation.getCurrentPosition(function(posicion) {
                    const lat = posicion.coords.latitude;
                    const lon = posicion.coords.longitude;
                    
                    texto.innerHTML = "📍 ¡Te encontramos!";
                    divMapa.style.display = "block"; 

                    if (!mapa) {
                        mapa = L.map('miMapa').setView([lat, lon], 17);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
                    } else {
                        mapa.setView([lat, lon], 17);
                    }

                    if (marcador) {
                        marcador.setLatLng([lat, lon]);
                    } else {
                        marcador = L.marker([lat, lon]).addTo(mapa).bindPopup("¡Estás aquí!").openPopup();
                    }
                }, function() {
                    texto.innerHTML = "❌ No nos diste permiso para ver la ubicación.";
                });
            } else {
                texto.innerHTML = "Tu navegador no soporta esta función.";
            }
        }
    </script>
</body>
</html>
