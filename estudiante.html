<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Estudiante - Objetos ESPOL</title>
    <!-- Conectado al CSS centralizado -->
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="body-estudiante">

    <!-- Barra de navegación -->
    <div class="navbar">
        <h2>🎒 ESPOL Lost & Found</h2>
        <nav>
            <a href="menu.html">Inicio</a>
            <a href="estudiante.html" style="color: #003366;">Reportar</a>
            <a href="guardia.html">Personal</a>
        </nav>
    </div>

    <!-- Estructura de Dos Columnas -->
    <div class="main-layout">
        
        <!-- COLUMNA IZQUIERDA: Formulario -->
        <div class="form-column">
            <h3 style="margin-top: 0; color: #003366;">Nuevo Reporte</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Ayúdanos a devolver las cosas a su dueño en el campus.</p>

            <form>
                <div class="form-group">
                    <label>¿Qué deseas hacer?</label>
                    <select>
                        <option>Perdí algo 😭</option>
                        <option>Encontré algo 😇</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>¿Qué objeto es?</label>
                    <select>
                        <option>Cartuchera</option>
                        <option>Tomatodo</option>
                        <option>Abrigo</option>
                        <option>Cédula / Carné</option>
                        <option>Audífonos</option>
                        <option>Otros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Descripción detallada:</label>
                    <textarea rows="2" placeholder="Ej: Es negra con cierre rojo..."></textarea>
                </div>

                <div class="form-group">
                    <label>Tu correo ESPOL o WhatsApp:</label>
                    <input type="text" placeholder="Ej: usuario@espol.edu.ec / 098...">
                </div>

                <div class="form-group">
                    <label>¿Dónde fue?</label>
                    <select>
                        <option>FCSH</option>
                        <option>FIEC</option>
                        <option>FCSNM</option>
                        <option>FIMCP</option>
                        <option>FICT</option>
                        <option>Biblioteca</option>
                        <option>Sweet & Coffee (FCSH)</option>
                        <option>Otro lugar</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="button" class="btn-location" onclick="obtenerUbicacion()">📍 Usar mi ubicación actual</button>
                    <p id="coordenadas" style="color: #003366; font-size: 12px; font-weight: bold; margin: 5px 0 0 0;"></p>
                </div>

                <!-- Caja Moderna para Foto -->
                <div class="form-group">
                    <label>Fotografía del objeto:</label>
                    <div class="file-drop-box">
                        <span style="font-size: 24px;">📷</span><br>
                        <span style="font-size: 13px; color: #003366; font-weight: bold;">Sube o arrastra una foto</span>
                        <p style="font-size: 11px; color: #888; margin: 2px 0 0 0;">JPG, PNG · Opcional</p>
                        <input type="file" accept="image/*">
                    </div>
                </div>

                <button type="button" class="btn-primary" style="margin: 0; width: 100%;">Publicar Reporte</button>
            </form>
        </div>

        <!-- COLUMNA DERECHA: Mapa Interactivo ESPOL -->
        <div class="map-column">
            <h3 style="margin-top: 0; color: #003366;">Ubicación en el Campus</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 10px;">Visualiza el punto exacto del reporte en el mapa de la ESPOL:</p>
            
            <div id="miMapa"></div>
        </div>

    </div>

    <script>
        let mapa;
        let marcador;

        window.onload = function() {
            mapa = L.map('miMapa').setView([-2.1444, -79.9675], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(mapa);
        };

        function obtenerUbicacion() {
            const texto = document.getElementById("coordenadas");

            if (navigator.geolocation) {
                texto.innerHTML = "Buscando tu ubicación... ⏳";
                navigator.geolocation.getCurrentPosition(function(posicion) {
                    const lat = posicion.coords.latitude;
                    const lon = posicion.coords.longitude;
                    
                    texto.innerHTML = "📍 ¡Te encontramos en el campus!";
                    
                    mapa.setView([lat, lon], 17);

                    if (marcador) {
                        marcador.setLatLng([lat, lon]);
                    } else {
                        marcador = L.marker([lat, lon]).addTo(mapa).bindPopup("📍 ¡Estás aquí!").openPopup();
                    }
                }, function() {
                    texto.innerHTML = "❌ No nos diste permiso para ver la ubicación.";
                });
            } else {
                texto.innerHTML = "Tu navegador no soporta esta función.";
            }
        }
    </script>
</body>
</html>
