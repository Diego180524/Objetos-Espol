<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Estudiante - Objetos ESPOL</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            /* Aquí ponemos tu nuevo fondo institucional corporativo */
            background-image: url('fondo-estudiante.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: sans-serif;
            color: #333;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Barra de navegación superior */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            backdrop-filter: blur(5px);
        }

        .navbar h2 {
            margin: 0;
            color: #003366;
            font-size: 20px;
        }

        .navbar nav a {
            text-decoration: none;
            color: #555;
            margin-left: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .navbar nav a:hover {
            color: #003366;
        }

        /* Contenedor principal de dos columnas */
        .main-layout {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Columna Izquierda: Formulario */
        .form-column {
            flex: 4;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
        }

        /* Columna Derecha: Mapa e interactividad */
        .map-column {
            flex: 6;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            font-size: 13px;
            display: block;
            margin-bottom: 5px;
            color: #444;
        }

        select, textarea, input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        /* Caja moderna para subir foto */
        .file-drop-box {
            border: 2px dashed #003366;
            background-color: #f8fbff;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
        }

        .file-drop-box input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Mapa grande a la derecha */
        #miMapa {
            flex: 1;
            width: 100%;
            min-height: 400px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-top: 10px;
        }

        .btn-primary {
            background-color: #003366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-primary:hover {
            background-color: #002244;
        }

        .btn-location {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Barra de navegación -->
    <div class="navbar">
        <h2>🎒 ESPOL Lost & Found</h2>
        <nav>
            <a href="menu.html">Inicio</a>
            <a href="estudiante.html" style="color: #003366;">Reportar</a>
            <a href="guardia.html">Personal</a>
        </nav>
    </div>

    <!-- Estructura de Dos Columnas -->
    <div class="main-layout">
        
        <!-- COLUMNA IZQUIERDA: Formulario -->
        <div class="form-column">
            <h3 style="margin-top: 0; color: #003366;">Nuevo Reporte</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Ayúdanos a devolver las cosas a su dueño en el campus.</p>

            <form>
                <div class="form-group">
                    <label>¿Qué deseas hacer?</label>
                    <select>
                        <option>Perdí algo 😭</option>
                        <option>Encontré algo 😇</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>¿Qué objeto es?</label>
                    <select>
                        <option>Cartuchera</option>
                        <option>Tomatodo</option>
                        <option>Abrigo</option>
                        <option>Cédula / Carné</option>
                        <option>Audífonos</option>
                        <option>Otros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Descripción detallada:</label>
                    <textarea rows="2" placeholder="Ej: Es negra con cierre rojo..."></textarea>
                </div>

                <div class="form-group">
                    <label>Tu correo ESPOL o WhatsApp:</label>
                    <input type="text" placeholder="Ej: usuario@espol.edu.ec / 098...">
                </div>

                <div class="form-group">
                    <label>¿Dónde fue?</label>
                    <select>
                        <option>FCSH</option>
                        <option>FIEC</option>
                        <option>FCSNM</option>
                        <option>FIMCP</option>
                        <option>FICT</option>
                        <option>Biblioteca</option>
                        <option>Sweet & Coffee (FCSH)</option>
                        <option>Otro lugar</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="button" class="btn-location" onclick="obtenerUbicacion()">📍 Usar mi ubicación actual</button>
                    <p id="coordenadas" style="color: #003366; font-size: 12px; font-weight: bold; margin: 5px 0 0 0;"></p>
                </div>

                <!-- Caja Moderna para Foto -->
                <div class="form-group">
                    <label>Fotografía del objeto:</label>
                    <div class="file-drop-box">
                        <span style="font-size: 24px;">📷</span><br>
                        <span style="font-size: 13px; color: #003366; font-weight: bold;">Sube o arrastra una foto</span>
                        <p style="font-size: 11px; color: #888; margin: 2px 0 0 0;">JPG, PNG · Opcional</p>
                        <input type="file" accept="image/*">
                    </div>
                </div>

                <button type="button" class="btn-primary">Publicar Reporte</button>
            </form>
        </div>

        <!-- COLUMNA DERECHA: Mapa Interactivo ESPOL -->
        <div class="map-column">
            <h3 style="margin-top: 0; color: #003366;">Ubicación en el Campus</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 10px;">Visualiza el punto exacto del reporte en el mapa de la ESPOL:</p>
            
            <div id="miMapa"></div>
        </div>

    </div>

    <script>
        let mapa;
        let marcador;

        window.onload = function() {
            mapa = L.map('miMapa').setView([-2.1444, -79.9675], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(mapa);
        };

        function obtenerUbicacion() {
            const texto = document.getElementById("coordenadas");

            if (navigator.geolocation) {
                texto.innerHTML = "Buscando tu ubicación... ⏳";
                navigator.geolocation.getCurrentPosition(function(posicion) {
                    const lat = posicion.coords.latitude;
                    const lon = posicion.coords.longitude;
                    
                    texto.innerHTML = "📍 ¡Te encontramos en el campus!";
                    
                    mapa.setView([lat, lon], 17);

                    if (marcador) {
                        marcador.setLatLng([lat, lon]);
                    } else {
                        marcador = L.marker([lat, lon]).addTo(mapa).bindPopup("📍 ¡Estás aquí!").openPopup();
                    }
                }, function() {
                    texto.innerHTML = "❌ No nos diste permiso para ver la ubicación.";
                });
            } else {
                texto.innerHTML = "Tu navegador no soporta esta función.";
            }
        }
    </script>
</body>
</html>
