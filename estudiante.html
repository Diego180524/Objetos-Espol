<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Estudiante - Objetos ESPOL</title>
    <link rel="stylesheet" href="style.css"> 
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .main-layout {
            display: flex;
            gap: 24px;
            max-width: 1050px;
            margin: 20px auto 40px auto;
            padding: 0 16px;
            align-items: flex-start;
        }

        .form-column {
            flex: 1.25;
            background: #ffffff;
            padding: 22px 24px;
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(0, 33, 66, 0.08);
            border: 1px solid #e2e8f0;
        }

        .map-column {
            flex: 0.95;
            background: #ffffff;
            padding: 20px 22px;
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(0, 33, 66, 0.08);
            border: 1px solid #e2e8f0;
            position: sticky;
            top: 20px;
        }

        #miMapa {
            width: 100%;
            height: 380px;
            border-radius: 14px;
            border: 1.5px solid #cbd5e1;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        @media (max-width: 820px) {
            .main-layout {
                flex-direction: column;
            }
            .map-column {
                width: 100%;
                position: static;
            }
            #miMapa {
                height: 300px;
            }
        }
    </style>
</head>
<body class="body-estudiante">

    <div class="navbar">
        <h2>🎒 ESPOL Lost & Found</h2>
        <nav>
            <a href="menu.html">Inicio</a>
            <a href="feed.html">Galería</a>
            <a href="estudiante.html" style="color: #003366;">Reportar</a>
        </nav>
    </div>

    <div class="main-layout">
        <div class="form-column">
            <h3 style="margin-top: 0; color: #003366;">Nuevo Reporte</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Ayúdanos a devolver las cosas a su dueño en el campus.</p>

            <form id="formReporte">
                <div class="form-group">
                    <label>¿Qué deseas hacer?</label>
                    <select id="tipoReporte">
                        <option value="Perdido">Perdí algo 😭</option>
                        <option value="Encontrado">Encontré algo 😇</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>¿Qué objeto es?</label>
                    <select id="tipoObjeto">
                        <option>Cartuchera</option>
                        <option>Tomatodo</option>
                        <option>Abrigo</option>
                        <option>Cédula / Carné</option>
                        <option>Audífonos</option>
                        <option>Otros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Descripción detallada:</label>
                    <textarea id="descripcionObjeto" rows="2" placeholder="Ej: Es negra con cierre rojo..."></textarea>
                </div>

                <div class="form-group">
                    <label>Tu correo ESPOL o WhatsApp:</label>
                    <input type="text" id="contactoUsuario" placeholder="Ej: usuario@espol.edu.ec / 098...">
                </div>

                <div class="form-group">
                    <label>¿Dónde fue?</label>
                    <select id="lugarObjeto">
                        <option>FADCOM</option>
                        <option>FCNM</option>
                        <option>FCSH</option>
                        <option>FCV</option>
                        <option>FICT</option>
                        <option>FIEC</option>
                        <option>FIMCM</option>
                        <option>FIMCP</option>
                        <option>Sweet and Coffee</option>
                        <option>Biblioteca</option>
                        <option>Otros</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="button" class="btn-location" onclick="obtenerUbicacion()">📍 Usar mi ubicación actual</button>
                    <p id="coordenadas" style="color: #003366; font-size: 12px; font-weight: bold; margin: 5px 0 0 0;"></p>
                </div>

                <div class="form-group">
                    <label>Fotografía del objeto:</label>
                    <div class="file-drop-box">
                        <span style="font-size: 24px;">📷</span><br>
                        <span id="textoFoto" style="font-size: 13px; color: #003366; font-weight: bold;">Sube o arrastra una foto</span>
                        <p style="font-size: 11px; color: #888; margin: 2px 0 0 0;">JPG, PNG · Opcional</p>
                        <input type="file" id="inputFoto" accept="image/*" onchange="mostrarNombreFoto()">
                    </div>
                </div>

                <button type="button" id="btnPublicar" class="btn-primary" onclick="publicarReporte()" style="margin: 0; width: 100%;">Publicar Reporte</button>
                <p id="estadoSubida" style="font-size: 13px; font-weight: bold; text-align: center; margin-top: 10px;"></p>
            </form>
        </div>

        <div class="map-column">
            <h3 style="margin-top: 0; color: #003366;">Ubicación en el Campus</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 12px;">Visualiza el punto exacto del reporte en el mapa:</p>
            <div id="miMapa"></div>
        </div>
    </div>

    <script>
        let mapa;
        let marcador;

        window.onload = function() {
            const esquinaSurOeste = L.latLng(-2.1800, -79.9800);
            const esquinaNorEste = L.latLng(-2.1330, -79.9450);
            const limitesAmpliados = L.latLngBounds(esquinaSurOeste, esquinaNorEste);

            mapa = L.map('miMapa', {
                center: [-2.1520, -79.9620],
                zoom: 15,
                minZoom: 14,
                maxZoom: 19,
                maxBounds: limitesAmpliados,
                maxBoundsViscosity: 0.9
            });

            L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '&copy; Google Maps'
            }).addTo(mapa);

            setTimeout(() => {
                mapa.invalidateSize();
            }, 300);
        };

        function obtenerUbicacion() {
            const texto = document.getElementById("coordenadas");

            if (navigator.geolocation) {
                texto.innerHTML = "Buscando tu ubicación... ⏳";
                navigator.geolocation.getCurrentPosition(function(posicion) {
                    const lat = posicion.coords.latitude;
                    const lon = posicion.coords.longitude;
                    
                    texto.innerHTML = "📍 ¡Te encontramos en el campus!";
                    mapa.setView([lat, lon], 17);

                    if (marcador) {
                        marcador.setLatLng([lat, lon]);
                    } else {
                        marcador = L.marker([lat, lon]).addTo(mapa).bindPopup("📍 ¡Estás aquí!").openPopup();
                    }
                }, function() {
                    texto.innerHTML = "❌ No nos diste permiso para ver la ubicación.";
                });
            } else {
                texto.innerHTML = "Tu navegador no soporta esta función.";
            }
        }

        function mostrarNombreFoto() {
            const input = document.getElementById("inputFoto");
            const texto = document.getElementById("textoFoto");
            if (input.files.length > 0) {
                texto.innerText = "Seleccionada: " + input.files[0].name;
            }
        }

        async function subirACloudinary(archivo) {
            const cloudName = "dgikbqti";
            const uploadPreset = "objetos_espol";
            const url = `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`;

            const formData = new FormData();
            formData.append("file", archivo);
            formData.append("upload_preset", uploadPreset);

            const respuesta = await fetch(url, {
                method: "POST",
                body: formData
            });

            if (!respuesta.ok) {
                throw new Error("Error al subir a Cloudinary");
            }

            const data = await respuesta.json();
            return data.secure_url;
        }

        async function publicarReporte() {
            const btn = document.getElementById("btnPublicar");
            const estado = document.getElementById("estadoSubida");
            const inputFoto = document.getElementById("inputFoto");

            const tipo = document.getElementById("tipoReporte").value;
            const objeto = document.getElementById("tipoObjeto").value;
            const desc = document.getElementById("descripcionObjeto").value.trim();
            const contacto = document.getElementById("contactoUsuario").value.trim();
            const lugar = document.getElementById("lugarObjeto").value;

            if (!desc) {
                alert("Por favor escribe una descripción para el reporte.");
                return;
            }

            btn.disabled = true;
            btn.style.opacity = "0.7";
            estado.style.color = "#003366";
            estado.innerText = "Procesando reporte... ⏳";

            let urlFoto = "";

            try {
                if (inputFoto.files.length > 0) {
                    estado.innerText = "Subiendo fotografía a la nube... ☁️";
                    urlFoto = await subirACloudinary(inputFoto.files[0]);
                }

                let categoria = "Otros";
                if (objeto === "Audífonos") categoria = "Tecnología";
                else if (objeto === "Cartuchera" || objeto === "Abrigo") categoria = "Accesorios";
                else if (objeto === "Cédula / Carné") categoria = "Documentos";

                const nuevoReporte = {
                    id: "local-" + Date.now(),
                    titulo: objeto,
                    categoria: categoria,
                    estado: tipo,
                    imagen: urlFoto,
                    lugar: lugar,
                    descripcion: desc,
                    contacto: contacto || "Puesto de seguridad ESPOL",
                    fecha: "Hoy"
                };

                const reportesExistentes = JSON.parse(localStorage.getItem("reportes_polifind") || "[]");
                reportesExistentes.unshift(nuevoReporte);
                localStorage.setItem("reportes_polifind", JSON.stringify(reportesExistentes));

                estado.style.color = "#28a745";
                estado.innerText = "✅ ¡Reporte publicado con éxito!";
                alert("¡Reporte guardado exitosamente!\nYa puedes verlo reflejado en la galería.");
                
                document.getElementById("formReporte").reset();
                document.getElementById("textoFoto").innerText = "Sube o arrastra una foto";
            } catch (error) {
                console.error(error);
                estado.style.color = "#c00";
                estado.innerText = "❌ Ocurrió un error al subir la fotografía.";
            } finally {
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
